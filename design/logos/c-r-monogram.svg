<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Concept C "R Monogram": R whose bowl is a radar ring with a blip -->
  <rect width="512" height="512" rx="112" fill="#0D0D0F"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#E53935" stroke-opacity="0.25" stroke-width="3"/>
  <g fill="none" stroke="#E53935" stroke-width="46" stroke-linecap="round">
    <!-- stem -->
    <path d="M166,142 L166,344"/>
    <!-- top and bottom bowl bars, merged deep into the ring band -->
    <path d="M166,142 L250,142"/>
    <path d="M166,286 L250,286"/>
    <!-- radar-ring bowl -->
    <circle cx="296" cy="214" r="72"/>
    <!-- leg -->
    <path d="M252,300 L344,368"/>
  </g>
  <!-- radar readout inside the ring's eye -->
  <circle cx="296" cy="214" r="36" fill="none" stroke="#E53935" stroke-opacity="0.3" stroke-width="4"/>
  <circle cx="280" cy="199" r="15" fill="#FF5252"/>
</svg>
